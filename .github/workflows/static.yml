# Build the package server site and deploy it to GitHub Pages.
#
# A push to master builds, checks and deploys the site. A pull request
# only builds and checks it. A failed build or check stops the run, so
# Pages keeps the last good site.
name: Build and deploy the package server

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # build.py reads the commit times of each brand.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build the packages
        run: python3 build.py
      - name: Check the packages
        run: python3 tests/check_build.py

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    # Do not stop a deploy that runs. Skip the runs that wait in the queue.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # build.py reads the commit times of each brand.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build the packages
        run: python3 build.py
      - name: Check the packages
        run: python3 tests/check_build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v5
